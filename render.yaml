services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PUBLIC_URL
        value: https://nexus-api-cdxi.onrender.com
      - key: DATA_DIR
        value: ./data
